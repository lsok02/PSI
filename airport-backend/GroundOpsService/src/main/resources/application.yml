server:
  port: 8083

spring:
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:postgresql://localhost:5433/resources_db
    username: user
    password: password
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update

integration:
  security:
    base-url: http://localhost:8084
    default-location-id: 1
    forward-token: false
  auth:
    base-url: http://localhost:9090
