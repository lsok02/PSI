server:
  port: 9090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Auth endpoint
        - id: auth
          uri: http://localhost:9090
          predicates:
            - Path=/api/auth/**

        # Flight Service
        - id: flight-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/flights/**

        # Passenger Service
        - id: passenger-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/passengers/**

        # Security Service
        - id: security-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/security/**

        # Sensor Events (Security Service)
        - id: sensor-events
          uri: http://localhost:8084
          predicates:
            - Path=/api/sensor-events/**

jwt:
  secret: airport-gateway-super-secret-key-2024-with-32-chars!

logging:
  level:
    org.springframework.cloud.gateway: DEBUG